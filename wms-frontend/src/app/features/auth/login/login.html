<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800">

  <!-- Login Card -->

  <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-10">

    <!-- Logo -->

    <div class="text-center mb-8">

      <h1 class="text-5xl font-bold text-white tracking-wide">
        WMS
      </h1>

      <p class="text-slate-300 mt-3 text-sm">
        Workforce Management System
      </p>

    </div>

    <!-- Login Form -->

    <form
      (ngSubmit)="login()"
      class="space-y-6">

      <!-- Username -->

      <div>

        <label class="block text-slate-200 text-sm mb-2">
          Username
        </label>

        <input
          type="text"
          [(ngModel)]="loginData.username"
          name="username"
          required
          placeholder="Enter username"
          class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-500 text-white placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-400">

      </div>

      <!-- Password -->

      <div>

        <label class="block text-slate-200 text-sm mb-2">
          Password
        </label>

        <input
          type="password"
          [(ngModel)]="loginData.password"
          name="password"
          required
          placeholder="Enter password"
          class="w-full px-4 py-3 rounded-xl bg-white/10 border border-slate-500 text-white placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-400">

      </div>

      <!-- Login Button -->

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full py-3 rounded-xl bg-indigo-500 hover:bg-indigo-600 transition-all duration-300 text-white font-semibold shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">

        <span *ngIf="!isLoading">

          Login

        </span>

        <span *ngIf="isLoading">

          Logging in...

        </span>

      </button>

    </form>

    <!-- Footer -->

    <div class="mt-8 text-center">

      <p class="text-slate-400 text-sm">

        Secure enterprise workforce portal

      </p>

    </div>

  </div>

</div>
